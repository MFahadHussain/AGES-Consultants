version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: acctfin_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: acctfin_erp
      POSTGRES_USER: acctfin_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-AcctFin_Secure2025!}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acctfin_admin -d acctfin_erp"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - acctfin_network
    shm_size: '256mb'
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: acctfin_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@acctfin.erp}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-AcctFin_Admin2025!}
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "5050:5050"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - acctfin_network
    profiles:
      - admin

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  acctfin_network:
    driver: bridge
    internal: false
