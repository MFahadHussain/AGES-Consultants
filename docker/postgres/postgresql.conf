# ============================================================
# PostgreSQL 16 Configuration for AcctFin ERP
# Optimized for Accounting/Financial Workloads
# ============================================================

# Connection Settings
listen_addresses = '*'
port = 5432
max_connections = 100
superuser_reserved_connections = 3

# Memory Settings (for 2GB container)
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 16MB
maintenance_work_mem = 128MB
wal_buffers = 16MB

# WAL (Write-Ahead Logging) - Critical for Financial Data
wal_level = replica
max_wal_size = 1GB
min_wal_size = 256MB
checkpoint_completion_target = 0.9
archive_mode = on
archive_command = 'cp %p /backups/wal_archive/%f'

# Query Planning
random_page_cost = 1.1  # SSD-friendly
effective_io_concurrency = 200
default_statistics_target = 100

# Logging
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_statement = 'mod'  # Log DDL and DML (important for audit)
log_min_duration_statement = 500  # Log slow queries (>500ms)
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0

# Autovacuum
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min

# Locale
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'

# Security
ssl = off  # Enable in production with proper certificates
ssl_prefer_server_ciphers = on

# Lock Management
deadlock_timeout = 1s
max_locks_per_transaction = 128

# Statement Timeout (prevent runaway queries)
statement_timeout = 60000  # 60 seconds
idle_in_transaction_session_timeout = 300000  # 5 minutes
